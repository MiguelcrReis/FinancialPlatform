receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/elastic_mapping:
    log_statements:
      - context: scope
        statements:
          - set(attributes["elastic.mapping.mode"], "raw")
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  elasticsearch:
    endpoints:
      - http://elasticsearch:9200
    logs_index: financialplatform-logs

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/elastic_mapping, batch]
      exporters: [elasticsearch]
