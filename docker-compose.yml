services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: financialdb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  account-service:
    build:
      context: .
      dockerfile: src/AccountService/Dockerfile
    container_name: account-service
    ports:
      - "5092:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

  transaction-service:
    build:
      context: .
      dockerfile: src/TransactionService/Dockerfile
    container_name: transaction-service
    ports:
      - "5283:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__Database: financialdb
      MongoDb__Collection: transactions
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__ExchangeName: transactions-exchange
      RabbitMq__QueueName: transactions
      RabbitMq__RoutingKey: transaction.created
      RabbitMq__DeadLetterExchangeName: transactions-dlx
      RabbitMq__DeadLetterQueueName: transactions-dead-letter
      RabbitMq__DeadLetterRoutingKey: transaction.failed
      RabbitMq__MaxRetryCount: 3
      RabbitMq__ConnectionRetryCount: 10
      RabbitMq__ConnectionRetryDelaySeconds: 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5240:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Services__AccountService__BaseUrl: http://account-service:8080
      Services__TransactionService__BaseUrl: http://transaction-service:8080
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__ConnectionRetryCount: 10
      RabbitMq__ConnectionRetryDelaySeconds: 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_started

volumes:
  mongo-data:
